          </div>

          <div class="botoes">
            <button class="botao" onclick="submeter()" id="btnSubmeter">Confirmar Alternativa</button>
            <button class="botao" onclick="avancar()" id="btnProx" disabled>Próxima Pergunta</button>
          </div>
        </div>

        <div class="resultado" id="resultadoFinal">
          <h2>Resultado Final</h2>
          <p class="msg" id="msgFinal"></p>

          <div class="grafico">
            <canvas id="myChart"></canvas>
          </div>

  let numeroDaQuestaoAtual = 0

  let quantidadeDeQuestoes = listaDeQuestoes.length
  let comunicacao = 0;
  let lideranca = 0;
  let empatia = 0;
  let relacionamento = 0;
  let inteligenciaEmocional = 0;


  function onloadEsconder() {

    document.getElementById("jogo").style.display = "none"
    document.getElementById("resultadoFinal").style.display = "none"
  }

  function iniciarQuiz() {

    document.getElementById("btnIniciarQuiz").style.display = "none"
    document.getElementById("jogo").style.display = "block"
    document.getElementById("qtdQuestoes").innerHTML = quantidadeDeQuestoes
    preencherHTMLcomQuestaoAtual(0)
  }

  function preencherHTMLcomQuestaoAtual(index) {
    const questaoAtual = listaDeQuestoes[index]
    numeroDaQuestaoAtual = index
    document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1
    document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta
    document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA
    document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB
    document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC
    document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativaD
  }

  function submeter() {
    const options = document.getElementsByName("option")
    let hasChecked = false

    for (let i = 0; i < options.length; i++) {
      if (options[i].checked) {
        hasChecked = true
        break
      }
    }

    if (!hasChecked) {
      alert("Escolha uma alternativa.")
    } else {
      btnSubmeter.disabled = true
      btnProx.disabled = false
      checarResposta()
    }
  }

  function avancar() {

    btnProx.disabled = true
    btnSubmeter.disabled = false
    desmarcarRadioButtons()
    if (numeroDaQuestaoAtual <= quantidadeDeQuestoes - 1) {
      preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
    } else {
      finalizarJogo()
    }
  }

  function tentarNovamente() {
    window.location.reload()
  }

  function checarResposta() {
    const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual]
    const options = document.getElementsByName("option")

    for (let i = 0; i < options.length; i++) {

      if (options[i].checked) {
        let valor = 0

        if (options[i].value == "alternativaA") {

          valor = questaoAtual.valorA
        } else if (options[i].value == "alternativaB") {

          valor = questaoAtual.valorB
        } else if (options[i].value == "alternativaC") {

          valor = questaoAtual.valorC
        } else if (options[i].value == "alternativaD") {

          valor = questaoAtual.valorD
        }

        if (questaoAtual.competencia == "comunicacao") {

          comunicacao += valor
        } else if (questaoAtual.competencia == "lideranca") {

          lideranca += valor
        } else if (questaoAtual.competencia == "empatia") {

          empatia += valor
        } else if (questaoAtual.competencia == "relacionamento") {

          relacionamento += valor
        } else if (questaoAtual.competencia == "inteligenciaEmocional") {

          inteligenciaEmocional += valor
        }

        numeroDaQuestaoAtual++
      }
    }
  }

  function desmarcarRadioButtons() {

    const options = document.getElementsByName("option")

    for (let i = 0; i < options.length; i++) {

      options[i].checked = false
    }
  } 

  function finalizarJogo() {

    document.getElementById("jogo").style.display = "none"

    document.getElementById("resultadoFinal").style.display = "block"

    let maiorCompetencia = ""
    let maiorValor = 0

    if (comunicacao > maiorValor) {

      maiorValor = comunicacao
      maiorCompetencia = "Comunicação"

    }

    if (lideranca > maiorValor) {

      maiorValor = lideranca
      maiorCompetencia = "Liderança"

    }

    if (empatia > maiorValor) {

      maiorValor = empatia
      maiorCompetencia = "Empatia"

    }

    if (relacionamento > maiorValor) {

      maiorValor = relacionamento
      maiorCompetencia = "Relacionamento"

    }

    if (inteligenciaEmocional > maiorValor) {

      maiorValor = inteligenciaEmocional
      maiorCompetencia = "Inteligência Emocional"

    }

    let somaTotal = comunicacao + lideranca + empatia + relacionamento + inteligenciaEmocional;
    let mensagemFinal = ""

    if (somaTotal <= 25) {

      mensagemFinal =
        `Sua competência mais forte foi: ${maiorCompetencia}
    <br><br>Ponto de partida! Você fez ${somaTotal} de 60 pontos.`
    } else if (somaTotal <= 45) {

      mensagemFinal =
        `Sua competência mais forte foi: ${maiorCompetencia}
    <br><br>No caminho certo! Você fez ${somaTotal} de 60 pontos.`
    } else {

      mensagemFinal =
        `Sua competência mais forte foi: ${maiorCompetencia}
    <br><br>Parabéns! Excelente desempenho com ${somaTotal} de 60 pontos.`
    }

    document.getElementById("msgFinal").innerHTML = mensagemFinal

    fetch("/quiz/salvarResultado", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        fkUsuario: sessionStorage.ID_USUARIO,
        comunicacao: comunicacao,
        lideranca: lideranca,
        empatia: empatia,
        relacionamento: relacionamento,
        inteligenciaEmocional: inteligenciaEmocional
      })

    })
      .then(function (resposta) {

        if (resposta.ok) {

          console.log("Resultado salvo com sucesso!")

        } else {

          console.log("Erro ao salvar resultado!")

        }

      })
      .catch(function (erro) {

        console.log("Erro ao salvar resultado:", erro)

      })

    criarGrafico()

  }

  function criarGrafico() {

    let comunicacaoPct =
      (comunicacao / 12) * 100

    let liderancaPct =
      (lideranca / 12) * 100

    let empatiaPct =
      (empatia / 12) * 100

    let relacionamentoPct =
      (relacionamento / 12) * 100

    let inteligenciaEmocionalPct =
      (inteligenciaEmocional / 12) * 100

    let comp = document.getElementById('myChart')

    new Chart(comp, {

      type: 'radar',

      data: {

        labels: [

          'Comunicação',
          'Liderança',
          'Empatia',
          'Relacionamento',
          'Inteligência Emocional'

        ],

        datasets: [{

          label: 'Seu Perfil (%)',

          data: [

            comunicacaoPct,
            liderancaPct,
            empatiaPct,
            relacionamentoPct,
            inteligenciaEmocionalPct

          ],

          fill: true,

          backgroundColor: 'rgba(166, 123, 79, 0.2)',

          borderColor: '#a67b4f',

          pointBackgroundColor: '#a67b4f'

        }]

      },

      options: {

        responsive: true,

        scales: {

          r: {

            min: 0,
            max: 100,

            ticks: {

              stepSize: 20

            }

          }

        }

      }

    })

  }
